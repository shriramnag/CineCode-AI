name: Build & Publish CineCode-AI APK

on:
  push:
    branches:
      - main
      - feature/cinecode-v2-upgrade
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history needed by CheckVersionJsonTask and GenerateChangelogTask
          fetch-depth: 0

      - name: Fetch termux-am Source
        run: |
          if [ ! -d "termux-am/app/src/main" ]; then
            git submodule update --init --depth 1 termux-am 2>/dev/null || {
              rm -rf termux-am
              git clone --depth 1 https://github.com/termux/TermuxAm.git termux-am
            }
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Metadata & Version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          vf = Path("version.json")
          data = json.loads(vf.read_text(encoding="utf-8"))

          # Compute highest version_code ever seen in git history of version.json
          max_code = int(data.get("version_code", 1))
          beta = data.get("beta")
          if isinstance(beta, dict):
              max_code = max(max_code, int(beta.get("version_code", 0)))

          log = subprocess.run(["git", "log", "--format=%H", "--", "version.json"], capture_output=True, text=True)
          for sha in log.stdout.splitlines()[:40]:
              raw = subprocess.run(["git", "show", f"{sha}:version.json"], capture_output=True, text=True)
              if raw.returncode != 0:
                  continue
              try:
                  old = json.loads(raw.stdout)
                  max_code = max(max_code, int(old.get("version_code", 0)))
                  ob = old.get("beta")
                  if isinstance(ob, dict):
                      max_code = max(max_code, int(ob.get("version_code", 0)))
              except Exception:
                  pass

          existing_tags = set(subprocess.run(["git", "tag", "-l"], capture_output=True, text=True).stdout.splitlines())
          stable_ver = str(data.get("version_name", "2.0.4"))
          parts = [int(x) for x in stable_ver.split(".")[:3]]
          beta_base = f"{parts[0]}.{parts[1]}.{parts[2] + 1}"

          if not isinstance(beta, dict):
              beta = {}
          cur_beta_name = str(beta.get("version_name", f"{beta_base}-beta.1"))
          m = re.match(r"^(\d+\.\d+\.\d+)-beta\.(\d+)$", cur_beta_name)
          beta_prefix = m.group(1) if m else beta_base
          beta_num = int(m.group(2)) if m else 1

          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              beta_num += 1
              next_code = max_code + 1
          else:
              next_code = max(int(beta.get("version_code", 0)), max_code)

          while f"v{beta_prefix}-beta.{beta_num}" in existing_tags:
              beta_num += 1
              next_code = max(next_code, max_code) + 1

          next_name = f"{beta_prefix}-beta.{beta_num}"
          subj = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          changelog_lines = beta.get("changelog") if isinstance(beta.get("changelog"), list) else []
          if subj and "[skip ci]" not in subj:
              changelog_lines = [subj] + [x for x in changelog_lines if x != subj]
          if not changelog_lines:
              changelog_lines = [f"CineCode-AI {next_name} build"]

          data["beta"] = {
              "version_code": next_code,
              "version_name": next_name,
              "changelog": changelog_lines[:6],
          }
          vf.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={next_code}\n")
              out.write(f"version_name={next_name}\n")
              out.write(f"tag=v{next_name}\n")
              out.write(f"name=CineCode-AI v{next_name}\n")
              out.write("changelog<<EOF\n")
              out.write("\n".join(f"- {l}" for l in changelog_lines[:6]) + "\n")
              out.write("EOF\n")
          print(f"Prepared beta version: {next_name} (code {next_code})")
          PY

      - name: Configure Signing Keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
            echo "Restored release.jks from RELEASE_KEYSTORE_BASE64 secret."
          else
            echo "RELEASE_KEYSTORE_BASE64 not set; release build will fall back to debug keystore."
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build CineCode-AI Release APK
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/build_all_apks.sh --release
          ./scripts/build_all_apks.sh --release --chroot
          for apk in output/*.apk; do
            unzip -tq "$apk" >/dev/null
            sha256sum "$apk"
          done

      - name: Sync version.json [skip ci]
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(version): bump to ${{ steps.version.outputs.tag }} (code ${{ steps.version.outputs.version_code }}) [skip ci]"
            BRANCH="${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "$BRANCH" || true
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCode-AI-${{ steps.version.outputs.tag }}-APKs
          path: output/*.apk
          retention-days: 30

      - name: Publish GitHub Beta Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ### CineCode-AI (${{ steps.version.outputs.tag }})
            Built from AntiGem 2.0.4 core with `ai.cinecod` package ID & CineCode-AI branding.

            ${{ steps.version.outputs.changelog }}
          prerelease: true
          make_latest: false
          files: output/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
