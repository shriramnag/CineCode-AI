name: Build & Publish Release

on:
  push:
    branches:
      - master
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          CHANGELOG=$(python3 -c "import json; cl = json.load(open('version.json')).get('changelog', ''); print('\n'.join(cl) if isinstance(cl, list) else cl)")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret (With Auto-Fallback)
        continue-on-error: true
        run: |
          if [ ! -f "debug.keystore" ] && [ -s "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          elif [ -s "debug.keystore" ]; then
            echo "⚠️ Warning: RELEASE_KEYSTORE_BASE64 secret is not set; using debug.keystore fallback."
            cp debug.keystore app/release.jks
          else
            echo "⚠️ Warning: No keystore secret available; continuing with unsigned/debug APK build."
          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/*.sh 2>/dev/null || true
          ./scripts/build_all_apks.sh --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
