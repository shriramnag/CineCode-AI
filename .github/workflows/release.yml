name: Release APK Draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go IDE Bridge (Android arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin
          if [ -f "version.json" ]; then
            cp version.json agy_ide_bridge/pkg/buildinfo/version.json
          fi
          cd agy_ide_bridge
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          if [ -d "scripts" ]; then
            chmod +x scripts/*.sh 2>/dev/null || true
          fi

      - name: Resolve Release Version Metadata
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=1
          if [ -f "version.json" ]; then
            VERSION_CODE=$(python3 -c "import json; print(int(json.load(open('version.json')).get('version_code', 1)))" 2>/dev/null || echo 1)
            if [ -z "$VERSION_NAME" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))" 2>/dev/null || echo "1.0.0")
              TAG_NAME="v${VERSION_NAME}"
            fi
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE="${{ env.VERSION_CODE }}" \
            -PAPP_VERSION_NAME="${{ env.VERSION_NAME }}" \
            --no-daemon --max-workers=2 --stacktrace
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "CineCode-AI ${{ env.TAG_NAME }}"
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
