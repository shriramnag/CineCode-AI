name: Build and Sign CineCode Beta APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Increment Beta Version (YouTube Create Style)
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version_file = Path("version.json")
          if version_file.exists():
              data = json.loads(version_file.read_text(encoding="utf-8"))
          else:
              data = {
                  "version_code": 341125,
                  "version_name": "0.227.542-beta",
                  "min_supported_version_code": 1,
                  "changelog": [],
                  "is_critical": False,
              }

          current_code = int(data.get("version_code", 341125))
          raw_name = str(data.get("version_name", "0.227.542"))
          base_name = raw_name.split("-", 1)[0].strip()

          match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", base_name)
          if match:
              major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))
          else:
              major, minor, patch = 0, 227, 542

          patch += 1
          if patch >= 1000:
              minor += 1
              patch = 0

          next_version_code = current_code + 1
          next_version_name = f"{major}.{minor}.{patch:03d}-beta"
          tag_name = f"v{next_version_name}"
          apk_filename = f"CineCode-AI-{tag_name}-Signed.apk"
          repo = os.environ.get("GITHUB_REPOSITORY", "shriramnag/CineCode-AI")

          data["version_code"] = next_version_code
          data["version_name"] = next_version_name
          data["url"] = f"https://github.com/{repo}/releases/download/{tag_name}/{apk_filename}"

          existing_changelog = data.get("changelog")
          if not isinstance(existing_changelog, list):
              existing_changelog = [str(existing_changelog)] if existing_changelog else []

          filtered_changelog = [
              line for line in existing_changelog
              if isinstance(line, str) and not line.startswith("CineCode AI v")
          ]
          data["changelog"] = [
              f"CineCode AI {tag_name} (Signed Beta APK) का नया ऑटो-बिल्ड अपडेट",
              *filtered_changelog[:4],
          ]

          version_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_f:
              env_f.write(f"VERSION_CODE={next_version_code}\n")
              env_f.write(f"VERSION_NAME={next_version_name}\n")
              env_f.write(f"TAG_NAME={tag_name}\n")
              env_f.write(f"APK_FILENAME={apk_filename}\n")

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as out_f:
              out_f.write(f"version_code={next_version_code}\n")
              out_f.write(f"version_name={next_version_name}\n")
              out_f.write(f"tag_name={tag_name}\n")
              out_f.write(f"apk_filename={apk_filename}\n")
              out_f.write("changelog<<EOF\n")
              for line in data["changelog"]:
                  out_f.write(f"- {line}\n")
              out_f.write("EOF\n")

          print(f"Bumped version: {raw_name} ({current_code}) -> {next_version_name} ({next_version_code})")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go IDE Bridge (Android arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin
          cp version.json agy_ide_bridge/pkg/buildinfo/version.json
          cd agy_ide_bridge
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Release APK (Memory Safe)
        run: |
          ./gradlew :app:assembleRelease \
            -PAPP_VERSION_CODE="${{ env.VERSION_CODE }}" \
            -PAPP_VERSION_NAME="${{ env.VERSION_NAME }}" \
            --no-daemon --max-workers=2 --stacktrace || \
          ./gradlew :app:assembleDebug \
            -PAPP_VERSION_CODE="${{ env.VERSION_CODE }}" \
            -PAPP_VERSION_NAME="${{ env.VERSION_NAME }}" \
            --no-daemon --max-workers=2 --stacktrace

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > cinecode-release.jks
            echo "KEYSTORE_PASS=${{ secrets.RELEASE_KEYSTORE_PASS }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.RELEASE_KEY_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore cinecode-release.jks \
              -alias cinecodeKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "CineCodeKeyPass123" \
              -keypass "CineCodeKeyPass123" \
              -dname "CN=Shriram Nag, OU=Development, O=CineCode, L=Indore, ST=MP, C=IN"
            echo "KEYSTORE_PASS=CineCodeKeyPass123" >> $GITHUB_ENV
            echo "KEY_ALIAS=cinecodeKey" >> $GITHUB_ENV
            echo "KEY_PASS=CineCodeKeyPass123" >> $GITHUB_ENV
          fi

      - name: Sign APK with v1/v2/v3 Signing
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          TARGET_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$TARGET_APK" ]; then
            TARGET_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$TARGET_APK" ]; then
            echo "No APK found in app/build/outputs/apk/"
            exit 1
          fi
          echo "Found APK: $TARGET_APK"

          SIGNED_APK_PATH="app/build/outputs/apk/${{ env.APK_FILENAME }}"
          "$APKSIGNER" sign \
            --ks cinecode-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK_PATH" \
            "$TARGET_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK_PATH"
          ls -lh "$SIGNED_APK_PATH"

      - name: Commit & Sync version.json [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json has no changes to commit."
            exit 0
          fi
          git commit -m "chore(version): bump to ${{ env.TAG_NAME }} (code ${{ env.VERSION_CODE }}) [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCode-AI-${{ env.TAG_NAME }}-APK
          path: app/build/outputs/apk/${{ env.APK_FILENAME }}
          retention-days: 30

      - name: Publish GitHub Beta Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "CineCode-AI ${{ env.TAG_NAME }}"
          prerelease: true
          make_latest: false
          body: |
            ### CineCode-AI Beta Build (${{ env.TAG_NAME }})
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **APK File:** `${{ env.APK_FILENAME }}`

            ${{ steps.version.outputs.changelog }}
          files: app/build/outputs/apk/${{ env.APK_FILENAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
