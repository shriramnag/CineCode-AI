name: Build and Sign CineCode Beta APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Increment Beta Version (YouTube Create Style)
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version_file = Path("version.json")
          if version_file.exists():
              data = json.loads(version_file.read_text(encoding="utf-8"))
          else:
              data = {
                  "version_code": 341125,
                  "version_name": "0.227.542-beta",
                  "min_supported_version_code": 1,
                  "changelog": [],
                  "is_critical": False,
              }

          current_code = int(data.get("version_code", 341125))
          raw_name = str(data.get("version_name", "0.227.542"))
          base_name = raw_name.split("-", 1)[0].strip()

          match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", base_name)
          if match:
              major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))
          else:
              major, minor, patch = 0, 227, 542

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          is_tag_push = ref.startswith("refs/tags/")

          if is_tag_push and ref_name:
              tag_name = ref_name
              next_version_code = current_code
              next_version_name = tag_name[1:] if tag_name.startswith("v") else tag_name
          else:
              patch += 1
              if patch >= 1000:
                  minor += 1
                  patch = 0
              if minor >= 1000:
                  major += 1
                  minor = 0

              suffix = "-beta" if "-beta" in raw_name.lower() else ""
              next_version_code = current_code + 1
              next_version_name = f"{major}.{minor}.{patch:03d}{suffix}"
              tag_name = f"v{next_version_name}"

          apk_filename = f"CineCode-AI-v{next_version_name}.apk"
          repo = os.environ.get("GITHUB_REPOSITORY", "shriramnag/CineCode-AI")

          data["version_code"] = next_version_code
          data["version_name"] = next_version_name
          data["url"] = f"https://github.com/{repo}/releases/download/{tag_name}/{apk_filename}"

          import subprocess

          def run_git(args):
              res = subprocess.run(
                  ["git", *args],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              return res.stdout.strip() if res.returncode == 0 else ""

          def is_bot_commit(msg: str) -> bool:
              lower = msg.strip().lower()
              return (
                  "[skip ci]" in lower
                  or lower.startswith("chore(version): bump")
                  or lower.startswith("chore: bump version")
              )

          def is_plain_commit_msg(msg: str) -> bool:
              lower = msg.strip().lower()
              cleaned = re.sub(
                  r"^(feat|fix|chore|refactor|docs|style|perf|ci|build|test)(\([^)]*\))?:\s*",
                  "",
                  lower,
              ).strip()
              if len(cleaned) < 16:
                  return True
              words = re.findall(r"[a-z0-9]+", cleaned)
              generic_words = {
                  "update", "updates", "updated", "fix", "fixes", "fixed",
                  "change", "changes", "changed", "edit", "edited", "save",
                  "saved", "sync", "wip", "test", "testing", "patch", "commit",
                  "file", "files", "code", "app", "minor", "misc", "cleanup",
                  "refactor", "create", "add", "added", "remove", "removed",
                  "upload", "initial", "auto", "build", "release", "bump",
              }
              if words and len(words) <= 3 and all(w in generic_words for w in words):
                  return True
              if re.match(r"^(update|create|delete|edit|fix|add|upload)\s+\S+\.\w+$", cleaned):
                  return True
              return False

          def filter_meaningful_files(paths):
              ignored = {
                  "version.json",
                  "agy_ide_bridge/pkg/buildinfo/version.json",
              }
              seen = set()
              result = []
              for p in paths:
                  p = p.strip()
                  if not p or p in ignored:
                      continue
                  name = Path(p).name or p
                  if name not in seen:
                      seen.add(name)
                      result.append(name)
              return result

          def get_commit_files(sha: str):
              raw = run_git(["diff-tree", "--no-commit-id", "--name-only", "-r", "--root", sha])
              return filter_meaningful_files(raw.splitlines()) if raw else []

          def find_previous_tag(current_tag: str, tag_push: bool) -> str:
              candidates = []
              if tag_push:
                  prev = run_git(["describe", "--tags", "--abbrev=0", f"--exclude={current_tag}", "HEAD"])
                  if prev and prev != current_tag:
                      candidates.append(prev)
                  prev_parent = run_git(["describe", "--tags", "--abbrev=0", "HEAD^"])
                  if prev_parent and prev_parent != current_tag:
                      candidates.append(prev_parent)
              else:
                  prev = run_git(["describe", "--tags", "--abbrev=0", "HEAD"])
                  if prev and prev != current_tag:
                      candidates.append(prev)

              if not candidates:
                  merged_tags = run_git(["tag", "--merged", "HEAD", "--sort=-creatordate"]).splitlines()
                  for t in merged_tags:
                      t = t.strip()
                      if t and t != current_tag:
                          candidates.append(t)
                          break
              return candidates[0] if candidates else ""

          def collect_commits(rev_range: str, include_merges: bool = False, limit: int = 15):
              args = ["log", f"-n{limit}", "--pretty=format:%H%x1f%h%x1f%s"]
              if not include_merges:
                  args.append("--no-merges")
              if rev_range:
                  args.append(rev_range)
              raw = run_git(args)
              commits = []
              for line in raw.splitlines():
                  parts = line.split("\x1f", 2)
                  if len(parts) != 3:
                      continue
                  full_sha, short_sha, subject = parts[0].strip(), parts[1].strip(), parts[2].strip()
                  if not subject or is_bot_commit(subject):
                      continue
                  commits.append((full_sha, short_sha, subject))
              return commits

          prev_tag = find_previous_tag(tag_name, is_tag_push)
          rev_range = f"{prev_tag}..HEAD" if prev_tag else ""

          commits = collect_commits(rev_range, include_merges=False, limit=15)
          if not commits and rev_range:
              commits = collect_commits(rev_range, include_merges=True, limit=15)
          if not commits:
              commits = collect_commits("", include_merges=False, limit=5)

          release_bullets = []
          plain_changelog = []
          seen_subjects = set()
          all_changed_files = []

          for full_sha, short_sha, subject in commits:
              files = get_commit_files(full_sha)
              for f in files:
                  if f not in all_changed_files:
                      all_changed_files.append(f)

              key = subject.lower()
              if key in seen_subjects:
                  continue
              seen_subjects.add(key)

              if is_plain_commit_msg(subject) and files:
                  top_files = files[:4]
                  extra = f" (+{len(files) - 4} और)" if len(files) > 4 else ""
                  files_md = ", ".join(f"`{f}`" for f in top_files) + extra
                  files_plain = ", ".join(top_files) + extra
                  release_bullets.append(f"- {subject} — बदली गई फ़ाइलें: {files_md} (`{short_sha}`)")
                  plain_changelog.append(f"{subject} (फ़ाइलें: {files_plain})")
              else:
                  release_bullets.append(f"- {subject} (`{short_sha}`)")
                  plain_changelog.append(subject)

          if not all_changed_files and rev_range:
              diff_raw = run_git(["diff", "--name-only", rev_range])
              all_changed_files = filter_meaningful_files(diff_raw.splitlines()) if diff_raw else []

          if not release_bullets:
              if all_changed_files:
                  top_files = all_changed_files[:6]
                  extra = f" (+{len(all_changed_files) - 6} और)" if len(all_changed_files) > 6 else ""
                  files_md = ", ".join(f"`{f}`" for f in top_files) + extra
                  files_plain = ", ".join(top_files) + extra
                  release_bullets.append(f"- बदली गई मुख्य फ़ाइलें: {files_md}")
                  plain_changelog.append(f"बदली गई मुख्य फ़ाइलें: {files_plain}")
              else:
                  release_bullets.append(f"- CineCode AI {tag_name} का नया ऑटो-बिल्ड अपडेट")
                  plain_changelog.append(f"CineCode AI {tag_name} का नया ऑटो-बिल्ड अपडेट")
          elif all_changed_files:
              top_files = all_changed_files[:8]
              extra = f" (+{len(all_changed_files) - 8} और)" if len(all_changed_files) > 8 else ""
              files_md = ", ".join(f"`{f}`" for f in top_files) + extra
              release_bullets.append("")
              release_bullets.append(f"**बदली गई मुख्य फ़ाइलें:** {files_md}")

          data["changelog"] = plain_changelog[:6]

          version_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_f:
              env_f.write(f"VERSION_CODE={next_version_code}\n")
              env_f.write(f"VERSION_NAME={next_version_name}\n")
              env_f.write(f"TAG_NAME={tag_name}\n")
              env_f.write(f"APK_FILENAME={apk_filename}\n")

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as out_f:
              out_f.write(f"version_code={next_version_code}\n")
              out_f.write(f"version_name={next_version_name}\n")
              out_f.write(f"tag_name={tag_name}\n")
              out_f.write(f"apk_filename={apk_filename}\n")
              out_f.write("changelog<<RELEASE_NOTES_EOF\n")
              for line in release_bullets:
                  out_f.write(f"{line}\n")
              out_f.write("RELEASE_NOTES_EOF\n")

          print(f"Bumped version: {raw_name} ({current_code}) -> {next_version_name} ({next_version_code})")
          print(f"Previous tag: {prev_tag or 'none'} | Dynamic release notes lines: {len(release_bullets)}")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go IDE Bridge (Android arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin
          cp version.json agy_ide_bridge/pkg/buildinfo/version.json
          cd agy_ide_bridge
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          if [ -d "scripts" ]; then
            chmod +x scripts/*.sh 2>/dev/null || true
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p app
          if [ ! -s "app/debug.keystore" ] || ! keytool -list -keystore app/debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f app/debug.keystore
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -s "debug.keystore" ] && [ -s "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            cp -f app/debug.keystore debug.keystore
          fi
          ls -lh debug.keystore app/debug.keystore

      - name: Build Standard Debug APK (assembleDebug)
        run: |
          rm -rf app/build/outputs/apk
          ./gradlew :app:assembleDebug \
            -PAPP_VERSION_CODE="${{ env.VERSION_CODE }}" \
            -PAPP_VERSION_NAME="${{ env.VERSION_NAME }}" \
            --no-daemon

          DEBUG_APK=$(find app/build/outputs/apk -path "*/debug/*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ]; then
            echo "No debug APK found in app/build/outputs/apk/**/debug/"
            exit 1
          fi
          echo "Standard Debug APK: $DEBUG_APK"

          FINAL_APK_PATH="app/build/outputs/apk/${{ env.APK_FILENAME }}"
          cp "$DEBUG_APK" "$FINAL_APK_PATH"
          ls -lh "$FINAL_APK_PATH"

          APK_SIZE=$(stat -c%s "$FINAL_APK_PATH")
          APK_SIZE_MB=$(python3 -c "print(f'{$APK_SIZE / (1024*1024):.2f} MB')")
          MIN_SIZE=$((10 * 1024 * 1024))
          echo "APK size: $APK_SIZE bytes ($APK_SIZE_MB | minimum required: $MIN_SIZE bytes)"
          if [ "$APK_SIZE" -le "$MIN_SIZE" ]; then
            echo "ERROR: APK size ($APK_SIZE bytes) is not greater than 10MB!"
            exit 1
          fi

          unzip -tq "$FINAL_APK_PATH" >/dev/null
          sha256sum "$FINAL_APK_PATH"
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$FINAL_APK_PATH"
          fi

      - name: Commit & Sync version.json [skip ci]
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json has no changes to commit."
            exit 0
          fi
          git commit -m "chore(version): bump to ${{ env.TAG_NAME }} (code ${{ env.VERSION_CODE }}) [skip ci]"
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"

      - name: Upload Beta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCode-AI-${{ env.TAG_NAME }}-APK
          path: app/build/outputs/apk/${{ env.APK_FILENAME }}
          retention-days: 30

      - name: Create GitHub Release Draft (Tag Push)
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CineCode-AI ${{ github.ref_name }}"
          draft: true
          generate_release_notes: false
          body: |
            ### CineCode-AI Release Draft (${{ github.ref_name }})
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **APK File:** `${{ env.APK_FILENAME }}`

            #### इस रिलीज़ में किए गए मुख्य सुधार / अपडेट:
            ${{ steps.version.outputs.changelog }}
          files: app/build/outputs/apk/${{ env.APK_FILENAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Pre-release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "CineCode-AI ${{ env.TAG_NAME }}"
          prerelease: true
          make_latest: false
          body: |
            ### CineCode-AI Beta Build (${{ env.TAG_NAME }})
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **APK File:** `${{ env.APK_FILENAME }}`

            #### इस रिलीज़ में किए गए मुख्य सुधार / अपडेट:
            ${{ steps.version.outputs.changelog }}
          files: app/build/outputs/apk/${{ env.APK_FILENAME }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
