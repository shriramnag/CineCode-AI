name: Build and Sign CineCode APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go IDE Bridge (Android arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin
          cp version.json agy_ide_bridge/pkg/buildinfo/version.json
          cd agy_ide_bridge
          GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Release APK (Memory Safe)
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace || ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > cinecode-release.jks
            echo "KEYSTORE_PASS=${{ secrets.RELEASE_KEYSTORE_PASS }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.RELEASE_KEY_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore cinecode-release.jks \
              -alias cinecodeKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "CineCodeKeyPass123" \
              -keypass "CineCodeKeyPass123" \
              -dname "CN=Shriram Nag, OU=Development, O=CineCode, L=Indore, ST=MP, C=IN"
            echo "KEYSTORE_PASS=CineCodeKeyPass123" >> $GITHUB_ENV
            echo "KEY_ALIAS=cinecodeKey" >> $GITHUB_ENV
            echo "KEY_PASS=CineCodeKeyPass123" >> $GITHUB_ENV
          fi

      - name: Sign APK with v2/v3 Signing
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          TARGET_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$TARGET_APK" ]; then
            echo "No APK found in app/build/outputs/apk/"
            exit 1
          fi
          echo "Found APK: $TARGET_APK"

          "$APKSIGNER" sign \
            --ks cinecode-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/CineCode-AI-Signed.apk \
            "$TARGET_APK"

          "$APKSIGNER" verify --verbose app/build/outputs/apk/CineCode-AI-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CineCode-AI-Release-APK
          path: app/build/outputs/apk/CineCode-AI-Signed.apk
