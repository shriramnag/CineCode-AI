name: Build and Sign CineCode APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore cinecode-release.jks \
            -alias cinecodeKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CineCodeKeyPass123" \
            -keypass "CineCodeKeyPass123" \
            -dname "CN=Shriram Nag, OU=Development, O=CineCode, L=Indore, ST=MP, C=IN"

      - name: Sign APK with v2/v3 Signing
        run: |
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          $APKSIGNER sign \
            --ks cinecode-release.jks \
            --ks-key-alias cinecodeKey \
            --ks-pass pass:CineCodeKeyPass123 \
            --key-pass pass:CineCodeKeyPass123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/CineCode-AI-Signed.apk \
            "$UNSIGNED_APK"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCode-AI-Release-APK
          path: app/build/outputs/apk/release/CineCode-AI-Signed.apk
