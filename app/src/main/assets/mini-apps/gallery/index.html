<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Asset Gallery - CineCode-AI</title>
<script src="file:///android_asset/miniapp-sdk/cinecode-miniapp-sdk.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #121318; color: #f4f4f6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  .item { background: #1c1e26; border: 1px solid #2b2f3d; border-radius: 12px; overflow: hidden; padding: 8px; }
  .item img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
  input[type=file] { width: 100%; margin: 8px 0; color: #ccc; }
  .cap { font-size: 11px; margin-top: 6px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <h2>🖼️ CineCode-AI Asset Gallery</h2>
  <p style="font-size:12px;color:#9aa0b4">Pick storyboard images from device (4GB RAM safe thumbnail preview).</p>
  <input type="file" accept="image/*" multiple onchange="loadFiles(this.files)" />
  <div id="grid" class="grid"></div>
<script>
  function loadFiles(files) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    Array.from(files).slice(0, 12).forEach(file => {
      const url = URL.createObjectURL(file);
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `<img src="${url}" /><div class="cap">${file.name}</div>`;
      grid.appendChild(div);
    });
    CineCodeMiniApp.toast("Loaded " + Math.min(files.length, 12) + " previews");
  }
</script>
</body>
</html>
