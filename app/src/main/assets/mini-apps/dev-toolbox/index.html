<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Dev Toolbox - CineCode-AI</title>
<script src="file:///android_asset/miniapp-sdk/cinecode-miniapp-sdk.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #121318; color: #f4f4f6; }
  textarea { width: 100%; box-sizing: border-box; background: #1c1e26; color: #e2e8f0; border: 1px solid #303444; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  button { background: #10B981; color: #052e16; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; font-size: 12px; }
  button.sec { background: #2b2f3d; color: #fff; }
</style>
</head>
<body>
  <h2>🧰 CineCode-AI Dev Toolbox</h2>
  <textarea id="input" rows="7" placeholder='Paste JSON, Base64, or URL text here...'></textarea>
  <div class="row">
    <button onclick="fmtJson()">Format JSON</button>
    <button onclick="minJson()">Minify JSON</button>
    <button onclick="b64Enc()">Base64 Encode</button>
    <button onclick="b64Dec()">Base64 Decode</button>
    <button class="sec" onclick="copyOut()">Copy</button>
  </div>
  <textarea id="output" rows="7" readonly placeholder="Output appears here..."></textarea>
<script>
  const inp = () => document.getElementById("input").value;
  const setOut = (v) => document.getElementById("output").value = v;
  function fmtJson() { try { setOut(JSON.stringify(JSON.parse(inp()), null, 2)); } catch (e) { setOut("JSON Error: " + e.message); } }
  function minJson() { try { setOut(JSON.stringify(JSON.parse(inp()))); } catch (e) { setOut("JSON Error: " + e.message); } }
  function b64Enc() { try { setOut(btoa(unescape(encodeURIComponent(inp())))); } catch (e) { setOut("Error: " + e.message); } }
  function b64Dec() { try { setOut(decodeURIComponent(escape(atob(inp().trim())))); } catch (e) { setOut("Error: " + e.message); } }
  function copyOut() { CineCodeMiniApp.clipboard.copy(document.getElementById("output").value); CineCodeMiniApp.toast("Copied output!"); }
</script>
</body>
</html>
