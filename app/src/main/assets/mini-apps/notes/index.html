<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Quick Notes - CineCode-AI</title>
<script src="file:///android_asset/miniapp-sdk/cinecode-miniapp-sdk.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #121318; color: #f4f4f6; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  textarea, input { width: 100%; box-sizing: border-box; background: #1c1e26; color: #fff; border: 1px solid #303444; border-radius: 10px; padding: 10px; font-size: 14px; margin-bottom: 10px; }
  button { background: #D97757; color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
  .card { background: #1c1e26; border: 1px solid #2b2f3d; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .meta { font-size: 11px; color: #9aa0b4; margin-top: 4px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <h2>📝 CineCode-AI Quick Notes</h2>
  <input id="title" placeholder="Note title (e.g. @MahaPauranik Script Hook)" />
  <textarea id="body" rows="4" placeholder="Write script, code snippet or idea..."></textarea>
  <button onclick="saveNote()">Save Note</button>
  <div id="list"></div>
<script>
  const KEY = "notes_v1";
  function render() {
    const notes = CineCodeMiniApp.storage.get(KEY, []);
    document.getElementById("list").innerHTML = notes.map((n, i) => `
      <div class="card">
        <strong>${escapeHtml(n.title)}</strong>
        <div style="margin-top:6px;white-space:pre-wrap;font-size:13px">${escapeHtml(n.body)}</div>
        <div class="meta">
          <span>${n.time}</span>
          <span>
            <a href="#" style="color:#8ab4f8;margin-right:10px" onclick="copyNote(${i});return false;">Copy</a>
            <a href="#" style="color:#f28b82" onclick="delNote(${i});return false;">Delete</a>
          </span>
        </div>
      </div>
    `).join("");
  }
  function saveNote() {
    const title = document.getElementById("title").value.trim() || "Untitled Note";
    const body = document.getElementById("body").value.trim();
    if (!body) return CineCodeMiniApp.toast("Write something first");
    const notes = CineCodeMiniApp.storage.get(KEY, []);
    notes.unshift({ title, body, time: new Date().toLocaleTimeString() });
    CineCodeMiniApp.storage.set(KEY, notes.slice(0, 50));
    document.getElementById("title").value = "";
    document.getElementById("body").value = "";
    CineCodeMiniApp.toast("Note saved!");
    render();
  }
  function copyNote(i) {
    const notes = CineCodeMiniApp.storage.get(KEY, []);
    if (notes[i]) { CineCodeMiniApp.clipboard.copy(notes[i].body); CineCodeMiniApp.toast("Copied!"); }
  }
  function delNote(i) {
    const notes = CineCodeMiniApp.storage.get(KEY, []);
    notes.splice(i, 1);
    CineCodeMiniApp.storage.set(KEY, notes);
    render();
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  render();
</script>
</body>
</html>
